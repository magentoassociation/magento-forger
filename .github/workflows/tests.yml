name: Tests

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  statuses: write
  pull-requests: write

concurrency:
  group: >-
    ${{
      github.event_name == 'workflow_dispatch' && format('tests-{0}', github.ref)
      || contains(github.event.comment.body, '@forger run all tests') && format('tests-{0}', github.event.issue.number)
      || format('tests-noop-{0}', github.run_id)
    }}
  cancel-in-progress: true

jobs:
  # Run the suite on any branch from the Actions tab. Needs no secrets, so a
  # fork owner can run it on their own fork without being a collaborator here.
  manual:
    name: Tests (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/run-tests

  # Runs only when an authorized user comments the trigger phrase on a PR.
  comment:
    name: Tests (comment)
    if: >
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Check trigger phrase
        id: guard
        env:
          BODY: ${{ github.event.comment.body }}
        run: |
          triggered=false
          while IFS= read -r line; do
            trimmed="$(printf '%s' "$line" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' | tr '[:upper:]' '[:lower:]')"
            if [ "$trimmed" = "@forger run all tests" ]; then
              triggered=true
              break
            fi
          done <<< "$BODY"
          echo "triggered=$triggered" >> "$GITHUB_OUTPUT"

      - name: Acknowledge
        if: steps.guard.outputs.triggered == 'true'
        run: |
          gh api "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            -f content=eyes

      - name: Resolve PR head SHA
        id: pr
        if: steps.guard.outputs.triggered == 'true'
        run: |
          sha=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.issue.number }}" --jq .head.sha)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.guard.outputs.triggered == 'true'
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head

      - name: Mark status pending
        if: steps.guard.outputs.triggered == 'true'
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ steps.pr.outputs.sha }}" \
            -f state=pending -f context=tests -f target_url="$RUN_URL" -f description="Running tests"

      - uses: ./.github/actions/run-tests
        if: steps.guard.outputs.triggered == 'true'

      - name: Report result
        if: always() && steps.guard.outputs.triggered == 'true'
        run: |
          state=success
          description="Tests passed"
          if [ "${{ job.status }}" != "success" ]; then
            state=failure
            description="Tests failed"
          fi
          gh api "repos/${{ github.repository }}/statuses/${{ steps.pr.outputs.sha }}" \
            -f state="$state" -f context=tests -f target_url="$RUN_URL" -f description="$description"