name: Tests

on:
  pull_request:
    types: [opened, ready_for_review, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  statuses: write
  pull-requests: write

concurrency:
  group: tests-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  # Runs on every non-draft PR and on every push to an open PR.
  auto:
    name: Tests (auto)
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.pull_request.head.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Mark status pending
        run: |
          gh api "repos/${{ github.repository }}/statuses/$SHA" \
            -f state=pending -f context=tests -f target_url="$RUN_URL" -f description="Running tests"

      - uses: ./.github/actions/run-tests

      - name: Report result
        if: always()
        run: |
          state=success
          description="Tests passed"
          if [ "${{ job.status }}" != "success" ]; then
            state=failure
            description="Tests failed"
          fi
          gh api "repos/${{ github.repository }}/statuses/$SHA" \
            -f state="$state" -f context=tests -f target_url="$RUN_URL" -f description="$description"

  # Runs when an authorized user comments the trigger phrase on a PR.
  comment:
    name: Tests (comment)
    if: >
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Check trigger phrase
        id: guard
        env:
          BODY: ${{ github.event.comment.body }}
        run: |
          triggered=false
          while IFS= read -r line; do
            trimmed="$(printf '%s' "$line" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' | tr '[:upper:]' '[:lower:]')"
            if [ "$trimmed" = "run all tests" ]; then
              triggered=true
              break
            fi
          done <<< "$BODY"
          echo "triggered=$triggered" >> "$GITHUB_OUTPUT"

      - name: Acknowledge
        if: steps.guard.outputs.triggered == 'true'
        run: |
          gh api "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            -f content=eyes

      - name: Resolve PR head SHA
        id: pr
        if: steps.guard.outputs.triggered == 'true'
        run: |
          sha=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.issue.number }}" --jq .head.sha)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.guard.outputs.triggered == 'true'
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head

      - name: Mark status pending
        if: steps.guard.outputs.triggered == 'true'
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ steps.pr.outputs.sha }}" \
            -f state=pending -f context=tests -f target_url="$RUN_URL" -f description="Running tests"

      - uses: ./.github/actions/run-tests
        if: steps.guard.outputs.triggered == 'true'

      - name: Report result
        if: always() && steps.guard.outputs.triggered == 'true'
        run: |
          state=success
          description="Tests passed"
          if [ "${{ job.status }}" != "success" ]; then
            state=failure
            description="Tests failed"
          fi
          gh api "repos/${{ github.repository }}/statuses/${{ steps.pr.outputs.sha }}" \
            -f state="$state" -f context=tests -f target_url="$RUN_URL" -f description="$description"