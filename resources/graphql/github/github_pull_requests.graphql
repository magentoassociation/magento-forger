query($owner: String!, $name: String!, $cursor: String) {
  rateLimit {
    remaining
    resetAt
  }
  repository(owner: $owner, name: $name) {
    pullRequests(first: 25, after: $cursor, orderBy: {field: UPDATED_AT, direction: DESC}) {
      pageInfo {
        hasNextPage
        endCursor
      }
      nodes {
        id
        number
        title
        url
        state
        isDraft
        createdAt
        updatedAt
        mergedAt
        closedAt
        additions
        deletions
        changedFiles
        author {
          login
          ... on User { company }
        }
        comments {
          totalCount
        }
        reviews(first: 50) {
          totalCount
          nodes {
            id
            author {
              login
            }
            state
            submittedAt
          }
        }
        labels (first: 10) {
          nodes {
            name
          }
        }
        closingIssuesReferences(first: 25) {
          nodes {
            number
          }
        }
        timelineItems(first: 100, itemTypes: [LABELED_EVENT, UNLABELED_EVENT, REVIEW_REQUESTED_EVENT, REVIEW_REQUEST_REMOVED_EVENT]) {
          pageInfo { hasNextPage endCursor }
          nodes {
            __typename
            ... on LabeledEvent { id actor { login } createdAt label { name } }
            ... on UnlabeledEvent { id actor { login } createdAt label { name } }
            ... on ReviewRequestedEvent { id actor { login } createdAt requestedReviewer { ... on User { login } } }
            ... on ReviewRequestRemovedEvent { id actor { login } createdAt requestedReviewer { ... on User { login } } }
          }
        }
      }
    }
  }
}
